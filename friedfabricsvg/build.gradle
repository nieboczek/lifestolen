import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "2.4.0"
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

loom {
    runs {
        // Empty — prevent Loom from generating default client/server run configs
        // for this library subproject, which would cause Gradle 9's project-wide
        // task resolution to start a second Minecraft process.
    }
}

// Library project — don't run a separate client
tasks.matching { it.name in ["runClient", "runServer", "runClientRenderDoc"] }.configureEach {
    enabled = false
    group = null
    description = "$project.name is a library — use :runClient instead"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    implementation "com.github.weisj:jsvg:2.1.0"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_25
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand inputs.properties
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
