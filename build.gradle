import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.0"
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name "CaffeineMC"
		url "https://maven.caffeinemc.net/releases"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    compileOnly "net.caffeinemc:sodium-fabric:0.9.1+mc26.2"

    implementation "com.github.weisj:jsvg:2.1.0"
}

processResources {
	inputs.property "version", project.version
	inputs.property "loader_version", project.loader_version
	inputs.property "minecraft_version", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand inputs.properties
	}
}

def generatedDir = layout.buildDirectory.dir("generated/sources/main/kotlin")
sourceSets.main.kotlin.srcDir(generatedDir)

def generateBuildInfo = tasks.register("generateBuildInfo") {
    def pkg = "nieboczek.lifestolen"
	def objectName = "BuildInfo"

	doLast {
        def outputDir = generatedDir.get().asFile
		def file = file("$outputDir/${pkg.replace('.', '/')}/${objectName}.kt")
		file.parentFile.mkdirs()

		def env1 = System.getenv("LIFESTOLEN_CONFIG_GLOBAL")
		def configGlobal = env1 == "true" || env1 == "1" ? "true" : "false"
		def env2 = System.getenv("LIFESTOLEN_CONFIG_LOCATION")
		def configLocation = env2 == null ? "lifestolen.txt" : env2

		file.text = """\
package $pkg

object $objectName {
    const val MOD_VERSION: String = "${project.version}"
    const val CONFIG_GLOBAL: Boolean = ${configGlobal}
    const val CONFIG_LOCATION: String = "${configLocation}"
}
""".stripIndent()
	}
}

tasks.named("compileKotlin") {
	dependsOn(generateBuildInfo)
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_25
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

loom {
	accessWidenerPath = file("src/main/resources/lifestolen.accesswidener")
}
